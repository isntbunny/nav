<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>文件选择器</title>
</head>
<body>
<input type="file" id="fileInput" multiple>
<script>
document.getElementById('fileInput').addEventListener('change', function(e) {
const files = e.target.files;
for (let file of files) {
console.log("选中文件:", file.name);
}
});
</script>
</body>
</html>
