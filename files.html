<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>文件选择器</title>
</head>
<body>
<input type="file" id="fileInput" multiple>

<div id="meta" style="display:none;">
    当前文件: <span id="fileName"></span>
</div>

<div id="previewContainer" style="display:none;">
    <iframe id="previewFrame" width="100%" height="500" style="border:1px solid #ccc;"></iframe>
</div>

<button id="openAgainBtn" disabled>在新标签页中打开</button>
<button id="clearBtn" disabled>清除</button>

<script>
(function() {
    var fileInput = document.getElementById('fileInput');
    var previewFrame = document.getElementById('previewFrame');
    var previewContainer = document.getElementById('previewContainer');
    var meta = document.getElementById('meta');
    var fileName = document.getElementById('fileName');
    var openAgainBtn = document.getElementById('openAgainBtn');
    var clearBtn = document.getElementById('clearBtn');

    var currentFile = null;
    var currentURL = null;

    function revokeURL() {
        if (currentURL) {
            URL.revokeObjectURL(currentURL);
            currentURL = null;
        }
    }

    function resetPreview() {
        revokeURL();
        currentFile = null;
        previewFrame.src = 'about:blank';
        previewContainer.style.display = 'none';
        meta.style.display = 'none';
        fileName.textContent = '';
        openAgainBtn.disabled = true;
        clearBtn.disabled = true;
    }

    fileInput.addEventListener('change', function(e) {
        var files = e.target.files;
        if (!files || files.length === 0) {
            return;
        }

        var file = files[0];

        revokeURL();

        currentFile = file;
        currentURL = URL.createObjectURL(file);

        fileName.textContent = file.name;
        meta.style.display = 'block';

        previewFrame.src = currentURL;
        previewContainer.style.display = 'block';

        openAgainBtn.disabled = false;
        clearBtn.disabled = false;

        try {
            var newWin = window.open(currentURL, '_blank');
            if (newWin) {
                newWin.focus();
            }
        } catch (err) {
            console.warn('打开新标签页失败:', err);
        }
    });

    openAgainBtn.addEventListener('click', function() {
        if (!currentFile || !currentURL) {
            alert('没有可打开的文件');
            return;
        }
        try {
            var newWin = window.open(currentURL, '_blank');
            if (!newWin) {
                alert('弹出窗口被拦截，请允许弹窗。');
            } else {
                newWin.focus();
            }
        } catch (err) {
            alert('打开文件时出错: ' + err.message);
        }
    });

    clearBtn.addEventListener('click', function() {
        resetPreview();
        fileInput.value = '';
    });

    window.addEventListener('beforeunload', function() {
        revokeURL();
    });

    resetPreview();
})();
</script>
</body>
</html>
